name: Compile checked-in 3D game on navigation branch
on:
  push:
    branches:
      - feature/real-3d-agent-navigation-20261025
permissions:
  contents: write
jobs:
  compile-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Rebuild offline standalone game and test
        run: |
          npm run build:game
          npm test
      - name: Commit generated browser bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game.bundle.js
          if ! git diff --cached --quiet; then
            git commit -m "Build standalone 3D bundle with collision-aware resident routing"
            git push origin HEAD:feature/real-3d-agent-navigation-20261025
          fi
